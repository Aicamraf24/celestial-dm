name: Build Celestial Dimension

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project zips (in name order, later ones overwrite earlier ones)
        run: |
          for Z in $(ls *.zip 2>/dev/null | sort); do
            echo "Descomprimiendo $Z"
            unzip -oq "$Z"
          done

      - name: Locate Gradle project
        run: |
          FILE=$(find . -maxdepth 3 -name settings.gradle | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::No se encontro settings.gradle. Contenido:"
            ls -la
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Proyecto Gradle en: $DIR"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1

      - name: Generate Gradle Wrapper (in an empty folder)
        run: |
          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
            mkdir -p /tmp/wrapper-gen
            cd /tmp/wrapper-gen
            touch settings.gradle
            gradle wrapper --gradle-version 9.4.1
            mkdir -p "$GITHUB_WORKSPACE/$PROJECT_DIR/gradle"
            cp -r gradle/wrapper "$GITHUB_WORKSPACE/$PROJECT_DIR/gradle/"
            cp gradlew gradlew.bat "$GITHUB_WORKSPACE/$PROJECT_DIR/"
          fi
          chmod +x "$GITHUB_WORKSPACE/$PROJECT_DIR/gradlew"

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Show compile errors (short)
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "---- Errores de compilacion (resumen) ----"
          grep -B1 -A4 "error:" build.log | head -150 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          if-no-files-found: ignore
          path: ${{ env.PROJECT_DIR }}/build.log

      - name: Verify jar
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ls -la build/libs/
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          test -s "$JAR"
          unzip -p "$JAR" fabric.mod.json | head -n 20
          unzip -l "$JAR" | grep -c 'assets/celestial_dimension/textures'

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: celestial_dimension-jar
          if-no-files-found: error
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
