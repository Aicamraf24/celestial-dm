name: Build Celestial Dimension

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.4.1
          fi
          chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Verify jar
        run: |
          ls -la build/libs/
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          test -s "$JAR"
          unzip -p "$JAR" fabric.mod.json | head -n 20
          unzip -l "$JAR" | grep -c 'assets/celestial_dimension/textures'

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: celestial_dimension-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
