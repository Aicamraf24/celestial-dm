name: Build Celestial Dimension

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project zip if needed
        run: |
          if [ -z "$(find . -maxdepth 3 -name settings.gradle | head -n 1)" ]; then
            ZIP=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
            if [ -n "$ZIP" ]; then
              echo "Descomprimiendo $ZIP"
              unzip -oq "$ZIP"
            fi
          fi

      - name: Locate Gradle project
        run: |
          FILE=$(find . -maxdepth 3 -name settings.gradle | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::No se encontro settings.gradle. Contenido:"
            ls -la
            find . -maxdepth 2 -not -path './.git*' | head -n 60
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Proyecto Gradle en: $DIR"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1

      - name: Generate Gradle Wrapper if missing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.4.1
          fi
          chmod +x gradlew

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew build --stacktrace

      - name: Verify jar
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ls -la build/libs/
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          test -s "$JAR"
          unzip -p "$JAR" fabric.mod.json | head -n 20
          unzip -l "$JAR" | grep -c 'assets/celestial_dimension/textures'

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: celestial_dimension-jar
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
          if-no-files-found: error
